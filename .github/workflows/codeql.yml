name: CodeQL
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 8 * * 1'

permissions:
  actions: read
  security-events: write
  contents: read

jobs:
  codeql:
    permissions:
      actions: read
      contents: read
      security-events: write
    # mnemom/.github @ main (Scorecard Pinned-Dependencies — pin to SHA)
    uses: mnemom/.github/.github/workflows/security-scan.yml@39adcd3176781a5bb748cd8c9748c962d68b18bf
    with:
      languages: "javascript-typescript,python"
