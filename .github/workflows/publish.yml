name: Publish

# Thin caller for the canonical publish recipes — see ADR-020.
# Both npm and PyPI logic now live in reusable workflows under mnemom/.github:
#   - npm-publish.yml  (provenance, SBOM, OIDC Trusted Publisher)
#   - pypi-publish.yml (provenance via Trusted Publisher, SBOM, skip-existing)
# To change either recipe, edit the canonical workflow there; do not re-add
# steps inline here.
#
# Repo-specific logic that stays inline:
#   - validate: tag vs. typescript/package.json + python/pyproject.toml versions
#   - test: TypeScript build + Python import smoke test
#
# The dispatch-publish path now invokes BOTH reusables in parallel — the
# orchestrator-driven auto-publish on every main push tries to ship both
# packages, with each reusable's idempotent skip-on-existing handling the
# unchanged-version case. Closes the npm/PyPI parity gap (May 8, 2026 audit).

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      dispatch-id:
        description: "Correlation ID from deploy orchestrator"
        required: false
        type: string
      npm-directory:
        description: "Directory containing package.json to publish"
        required: false
        type: string
        default: "typescript"


permissions: {}
jobs:
  # ── Release-triggered: validate → test → (publish-npm, publish-pypi) ──

  validate:
    permissions:
      contents: read
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v6
      - name: Extract version from tag
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
      - name: Validate Python version
        run: |
          PYPI_VERSION=$(python3 -c "
          import tomllib
          with open('python/pyproject.toml', 'rb') as f:
              print(tomllib.load(f)['project']['version'])
          ")
          if [ "$PYPI_VERSION" != "${{ steps.version.outputs.version }}" ]; then
            echo "ERROR: pyproject.toml version ($PYPI_VERSION) != tag (${{ steps.version.outputs.version }})"
            exit 1
          fi
      - name: Validate TypeScript version
        run: |
          NPM_VERSION=$(node -p "require('./typescript/package.json').version")
          if [ "$NPM_VERSION" != "${{ steps.version.outputs.version }}" ]; then
            echo "ERROR: package.json version ($NPM_VERSION) != tag (${{ steps.version.outputs.version }})"
            exit 1
          fi

  test:
    permissions:
      contents: read
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v6
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: "24"
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"
      - name: TypeScript checks
        working-directory: typescript
        run: npm install && npm run typecheck && npm run build
      - name: Python checks
        run: |
          pip install "python/"
          python -c "from mnemom_types import ReputationScore, GRADE_ORDINALS, COMPONENT_WEIGHTS; print('All imports OK')"

  publish-npm:
    needs: [validate, test]
    if: github.event_name == 'release'
    permissions:
      contents: write   # for SBOM attach to GitHub Release
      id-token: write   # for npm OIDC Trusted Publisher
    # mnemom/.github @ scale/step-29-bump-node24-actions merge (ADR-020)
    uses: mnemom/.github/.github/workflows/npm-publish.yml@3b60e34e88113070235f2d55248a3455295be153
    with:
      npm-directory: typescript
      tag: latest

  # PyPI Trusted Publishing does NOT support reusable workflows
  # (https://docs.pypi.org/trusted-publishers/troubleshooting/#reusable-workflows-on-github),
  # so the publish step is INLINE here. Don't try to lift it into a reusable
  # — the OIDC token's `job_workflow_ref` claim points to the reusable, and
  # PyPI rejects with `invalid-publisher`. Verified May 8, 2026.
  publish-pypi:
    name: Publish to PyPI
    needs: [validate, test]
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    permissions:
      id-token: write   # OIDC → PyPI Trusted Publisher
      contents: read
    environment: production
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v6
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"
      - name: Build sdist + wheel
        working-directory: python
        run: |
          python -m pip install --upgrade pip
          pip install build
          python -m build
      - name: Publish to PyPI (Trusted Publisher)
        uses: pypa/gh-action-pypi-publish@cef221092ed1bacb1cc03d23a2d87d1d172e277b # release/v1
        with:
          packages-dir: python/dist/

  # ── Orchestrator dispatch publishing ──
  #
  # The orchestrator's auto-publish-on-main-push fires both jobs below in
  # parallel. Each reusable's skip-on-existing logic makes a no-op publish
  # idempotent — when version is unchanged from the registry, the call
  # short-circuits without touching the registry.

  dispatch-publish-npm:
    if: github.event_name == 'workflow_dispatch'
    # NOTE: contents: write is over-granted relative to what dispatch-publish
    # actually does (the `gh release upload` step inside the reusable workflow
    # is gated on `github.event_name == 'release'` and never runs here). But
    # GitHub validates the caller's declared permissions against the called
    # workflow's declared permissions at workflow load time, before any `if:`
    # is evaluated. The reusable workflow declares `contents: write` because
    # the release-attach step *may* need it; callers must grant the union.
    permissions:
      contents: write
      id-token: write
    # mnemom/.github @ scale/step-29-bump-node24-actions merge (ADR-020)
    uses: mnemom/.github/.github/workflows/npm-publish.yml@3b60e34e88113070235f2d55248a3455295be153
    with:
      # Defensive defaults: GitHub Actions validates `with:` expressions at
      # workflow load time, before the job-level `if:` is evaluated. On a
      # release event the `inputs` context is empty, so a bare
      # `${{ inputs.npm-directory }}` resolves to "" — which fails the
      # reusable workflow's required-string input validation and causes a
      # workflow startup_failure. The `||` fallback keeps the expression
      # valid on both event types; the `if:` above still skips this job on
      # non-dispatch events.
      npm-directory: ${{ inputs.npm-directory || 'typescript' }}
      dispatch-id: ${{ inputs.dispatch-id || '' }}
      tag: latest
      attach-sbom-to-release: false   # dispatch path has no release to attach to

  dispatch-publish-pypi:
    name: Publish python (dispatch)
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      id-token: write   # OIDC → PyPI Trusted Publisher
      contents: read
    environment: production
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v6
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"
      - name: Read package metadata
        id: meta
        working-directory: python
        run: |
          PKG_NAME=$(python3 -c "
          import tomllib
          with open('pyproject.toml', 'rb') as f:
              print(tomllib.load(f)['project']['name'])
          ")
          PKG_VERSION=$(python3 -c "
          import tomllib
          with open('pyproject.toml', 'rb') as f:
              print(tomllib.load(f)['project']['version'])
          ")
          echo "pkg-name=$PKG_NAME" >> "$GITHUB_OUTPUT"
          echo "pkg-version=$PKG_VERSION" >> "$GITHUB_OUTPUT"
      - name: Check if already published
        id: check
        run: |
          PKG_NAME="${{ steps.meta.outputs.pkg-name }}"
          PKG_VERSION="${{ steps.meta.outputs.pkg-version }}"
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            "https://pypi.org/pypi/${PKG_NAME}/${PKG_VERSION}/json")
          if [ "$STATUS" = "200" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "${PKG_NAME}@${PKG_VERSION} already published — skipping"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
            echo "Will publish ${PKG_NAME}@${PKG_VERSION}"
          fi
      - name: Build sdist + wheel
        if: steps.check.outputs.skip != 'true'
        working-directory: python
        run: |
          python -m pip install --upgrade pip
          pip install build
          python -m build
      - name: Publish to PyPI (Trusted Publisher)
        if: steps.check.outputs.skip != 'true'
        uses: pypa/gh-action-pypi-publish@cef221092ed1bacb1cc03d23a2d87d1d172e277b # release/v1
        with:
          packages-dir: python/dist/
          skip-existing: true
